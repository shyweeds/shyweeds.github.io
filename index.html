<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="minimal personal homepage">
  <title>shyweeds</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0d0d;
      --fg: #e8e8e8;
      --muted: #8a8a8a;
      --line: #1f1f1f;
      --accent: #7dd3fc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.7 ui-monospace,
            SFMono-Regular,
            Menlo,
            Monaco,
            Consolas,
            "Liberation Mono",
            monospace;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 64px 20px;
    }

    main {
      width: 100%;
      max-width: 680px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    section {
      margin-top: 40px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 14px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--fg);
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li {
      margin: 8px 0;
      color: var(--muted);
    }

    a {
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color .15s ease;
    }

    a:hover {
      border-color: var(--accent);
    }

    .links {
      display: flex;
      gap: 18px;
      margin-top: 20px;
    }

    .prompt {
      color: var(--accent);
      margin-right: 8px;
    }

    footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    ::selection {
      background: rgba(125, 211, 252, 0.25);
    }
  </style>
</head>

<body>
  <main>
    <h1>shyweeds</h1>

    <p>
      studying system programming and operating systems.
    </p>

    <div class="links">
      <a href="https://github.com/shyweeds" target="_blank">github</a>
      <a href="https://gitee.com/happy_shyweeds" target="_blank">gitee</a>
    </div>

    <section>
      <h2>about</h2>

      <ul>
        <li>
          <span class="prompt">$</span>
          automation @ NUIST
        </li>

        <li>
          <span class="prompt">$</span>
          linux first
        </li>

        <li>
          <span class="prompt">$</span>
          maybe building a toy os
        </li>
      </ul>
    </section>

    <section>
      <h2>projects</h2>

      <ul>
        <li>
          <span class="prompt">></span>
          toy shell
        </li>

        <li>
          <span class="prompt">></span>
          toy webserver
        </li>

        <li>
          <span class="prompt">></span>
          dwm fork
        </li>

        <li>
          <span class="prompt">></span>
          dwm dotfiles
        </li>
      </ul>
    </section>

    <footer>
      minimalist static homepage
    </footer>
  </main>
</body>
</html>
