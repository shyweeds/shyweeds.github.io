<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shyweeds</title>
  <meta name="description" content="极简静态个人主页" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b0c10;
      --card: rgba(255, 255, 255, 0.06);
      --text: #f5f7fa;
      --muted: #a7b0bd;
      --line: rgba(255, 255, 255, 0.12);
      --accent: #7dd3fc;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f7f8;
        --card: rgba(255, 255, 255, 0.75);
        --text: #111827;
        --muted: #5b6472;
        --line: rgba(17, 24, 39, 0.1);
        --accent: #0284c7;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, rgba(125, 211, 252, 0.12), transparent 35%), var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(680px, 100%);
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.12);
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), transparent);
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 6vw, 3.2rem);
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .btn {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }

    ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="avatar" aria-hidden="true"></div>
      <h1>你的名字</h1>
      <p>一句话介绍自己，比如：正在学习编程、喜欢写作，也喜欢做一些小项目。</p>

      <div class="links" aria-label="社交链接">
        <a class="btn" href="https://github.com/你的账号" target="_blank" rel="noreferrer">GitHub</a>
        <a class="btn" href="mailto:you@example.com">Email</a>
        <a class="btn" href="https://x.com/你的账号" target="_blank" rel="noreferrer">X / Twitter</a>
      </div>

      <div class="section">
        <h2>关于我</h2>
        <ul>
          <li>专业 / 方向：例如 计算机科学</li>
          <li>当前关注：例如 Web、Linux、嵌入式</li>
          <li>个人主页：极简、清晰、可快速修改</li>
        </ul>
      </div>

      <div class="section">
        <h2>项目</h2>
        <ul>
          <li>项目 A：一句话说明</li>
          <li>项目 B：一句话说明</li>
          <li>项目 C：一句话说明</li>
        </ul>
      </div>

      <footer>© 2026 你的名字</footer>
    </section>
  </main>
</body>
</html>
