<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="minimal terminal homepage" />
  <title>shy's homepage</title>

  <style>
    :root {
      --bg: #000;
      --panel: #050505;
      --fg: #d7ffd7;
      --muted: #759275;
      --line: #1a1f1a;
      --accent: #66ff99;
      --glow: rgba(102, 255, 153, 0.12);
      --font: "SFMono-Regular", ui-monospace, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(102, 255, 153, 0.06), transparent 35%),
        var(--bg);
      color: var(--fg);
      font-family: var(--font);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    body {
      padding: clamp(10px, 2.4vw, 20px);
    }

    .terminal {
      width: min(900px, 100%);
      margin: 0 auto;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.01), transparent 20%),
        var(--panel);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.02), 0 18px 60px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      position: relative;
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.01);
    }

    .dots {
      display: flex;
      gap: 6px;
      flex: 0 0 auto;
    }

    .dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1d241d;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
    }

    .bar-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.9rem;
    }

    main {
      padding: clamp(14px, 2.2vw, 20px);
    }

    .ascii {
      color: var(--accent);
      white-space: pre;
      overflow-x: auto;
      margin: 0 0 18px;
      font-size: clamp(0.62rem, 1.4vw, 0.92rem);
      line-height: 1.35;
      scrollbar-width: none;
      text-shadow: 0 0 10px var(--glow);
    }

    .ascii::-webkit-scrollbar { display: none; }

    .line {
      margin: 0 0 12px;
      word-break: break-word;
    }

    .prompt { color: var(--accent); }
    .path { color: var(--muted); }

    .cmd-line {
      display: inline-flex;
      align-items: baseline;
      flex-wrap: wrap;
      min-width: 0;
      vertical-align: bottom;
    }

    .cmd {
      display: inline-block;
      min-width: 1px;
      color: var(--fg);
      text-shadow: 0 0 8px rgba(102, 255, 153, 0.06);
    }

    .caret {
      display: inline-block;
      width: 0.38ch;
      height: 1.05em;
      margin-left: 1px;
      border-right: 1px solid var(--accent);
      transform: translateY(0.12em);
      animation: blink 0.72s step-end infinite;
      vertical-align: baseline;
    }

    .caret.subtle {
      width: 0.32ch;
      border-right-width: 1px;
      animation: blink 0.62s step-end infinite;
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .status {
      margin: 12px 0 8px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      display: grid;
      gap: 8px;
      overflow: hidden;
      transition: padding 220ms ease, border-color 220ms ease, background 220ms ease, opacity 320ms ease, transform 320ms ease, max-height 320ms ease;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
    }

    .status-left {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .activity {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      flex: 0 0 auto;
    }

    .activity span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.35;
      animation: pulse 1s ease-in-out infinite;
    }

    .activity span:nth-child(2) { animation-delay: 0.14s; }
    .activity span:nth-child(3) { animation-delay: 0.28s; }

    @keyframes pulse {
      0%, 100% { transform: translateY(0); opacity: 0.28; }
      50% { transform: translateY(-1px); opacity: 0.9; }
    }

    .meter {
      position: relative;
      padding-top: 2px;
      transition: opacity 320ms ease, transform 320ms ease, max-height 320ms ease, margin 320ms ease;
      overflow: hidden;
      max-height: 60px;
    }

    .meter-ascii {
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      letter-spacing: 0.04em;
      text-shadow: 0 0 10px rgba(102,255,153,.10);
      user-select: none;
      min-height: 1.4em;
    }

    .ornament {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 520ms ease, transform 520ms ease;
      display: grid;
      justify-items: center;
      gap: 8px;
      margin-top: 6px;
      pointer-events: none;
    }

    .ornament.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .spectrum-wrap {
      position: relative;
      display: inline-block;
      padding: 10px 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.015);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      transform-origin: center;
    }

    .spectrum-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.02), transparent);
      background-size: 100% 4px;
      pointer-events: none;
    }

    .spectrum {
      margin: 0;
      color: var(--accent);
      line-height: 1.08;
      font-size: 0.92rem;
      white-space: pre;
      text-shadow: 0 0 10px rgba(102,255,153,.12);
      transition: transform .18s ease, text-shadow .18s ease;
    }

    .spectrum-wrap:hover .spectrum {
      transform: scale(1.02);
      text-shadow: 0 0 18px rgba(102,255,153,.22);
    }

    .ornament-caption {
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      user-select: none;
    }

    .spectrum-wrap.pulse {
      animation: spectrumPulse .42s ease;
    }

    @keyframes spectrumPulse {
      0% { transform: scale(1); }
      35% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .output {
      margin-top: 2px;
    }

    .output-line {
      margin: 0 0 2px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 1.75em;
    }

    .output-line.blank { min-height: 0.95em; }
    .output-line.title { color: var(--accent); margin-top: 14px; margin-bottom: 8px; }
    .output-line.tree { color: var(--fg); }
    .output-line.footer { color: var(--muted); margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
    .output-line.link a { color: var(--fg); text-decoration: none; }
    .output-line.link a:hover { color: var(--accent); }

    .scanline::after {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.015) 50%, transparent);
      background-size: 100% 4px;
      opacity: 0.22;
      mix-blend-mode: screen;
      animation: scan 8s linear infinite;
    }

    @keyframes scan {
      from { transform: translateY(-8px); }
      to { transform: translateY(8px); }
    }

    @media (max-width: 700px) {
      body { padding: 10px; }
      main { padding: 14px; }
      .bar { padding: 10px 12px; }
      .bar-title { font-size: 0.82rem; }
      .ascii { font-size: 0.58rem; }
      .line { font-size: 0.96rem; }
      .status-row { font-size: 0.8rem; }
      .spectrum { font-size: 0.82rem; }
    }

    @media (max-width: 420px) {
      main { padding: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="terminal scanline">
    <header class="bar">
      <div class="dots" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="bar-title">shyweeds@localhost:~</div>
    </header>

    <main>
      <pre class="ascii">
   _____ __
  / ___// /_  __  __
  \__ \/ __ \/ / / /
 ___/ / / / / /_/ /
/____/_/ /_/\__, /
           /____/
      </pre>

      <p class="line">
        <span class="prompt">shyweeds@localhost</span>:<span class="path">~</span>$
        <span class="cmd-line">
          <span class="cmd" id="typed-cmd" aria-live="polite"></span><span class="caret subtle" aria-hidden="true"></span>
        </span>
      </p>

      <div class="status" id="status" aria-live="polite" aria-atomic="true" hidden>
        <div class="status-row">
          <div class="status-left">
            <span id="status-label">[ rendering intro ]</span>
            <span class="activity" id="activity" aria-hidden="true">
              <span></span><span></span><span></span>
            </span>
          </div>
          <div id="status-right"></div>
        </div>

        <div class="meter" id="meter">
          <div class="meter-ascii" id="meter-ascii">[>............................]</div>
        </div>

        <div class="ornament" id="ornament" hidden>
          <div class="spectrum-wrap" id="spectrum-wrap" role="button" tabindex="0" aria-label="terminal ornament">
<pre class="spectrum" id="spectrum"></pre>
          </div>
          <div class="ornament-caption">[ ambient terminal signal ]</div>
        </div>
      </div>

      <div class="output" id="output" aria-live="polite"></div>
    </main>
  </div>

  <script>
    (() => {
      const cmdTarget = document.getElementById("typed-cmd");
      const output = document.getElementById("output");
      const status = document.getElementById("status");
      const statusLabel = document.getElementById("status-label");
      const statusRight = document.getElementById("status-right");
      const activity = document.getElementById("activity");
      const meter = document.getElementById("meter");
      const meterAscii = document.getElementById("meter-ascii");
      const ornament = document.getElementById("ornament");
      const spectrum = document.getElementById("spectrum");
      const spectrumWrap = document.getElementById("spectrum-wrap");

      const command = "cat ~/intro.txt";
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const rand = (min, max) => Math.floor(min + Math.random() * (max - min + 1));

      const steps = [
        { kind: "text", text: "studying system programming.", cls: "tree" },
        { kind: "text", text: "linux first.", cls: "tree" },
        { kind: "text", text: "interested in operating systems and low-level software.", cls: "tree" },
        { kind: "blank" },
        { kind: "text", text: "[ about ]", cls: "title" },
        { kind: "text", text: "├── university : NUIST", cls: "tree" },
        { kind: "text", text: "├── major      : automation", cls: "tree" },
        { kind: "text", text: "└── status     : making toyOS", cls: "tree" },
        { kind: "blank" },
        { kind: "text", text: "[ projects ]", cls: "title" },
        { kind: "text", text: "├── toy shell", cls: "tree" },
        { kind: "text", text: "├── toy webserver", cls: "tree" },
        { kind: "text", text: "├── toy malloc", cls: "tree" },
        { kind: "text", text: "├── dwm fork", cls: "tree" },
        { kind: "text", text: "└── dwm dotfiles", cls: "tree" },
        { kind: "blank" },
        { kind: "text", text: "[ links ]", cls: "title" },
        { kind: "link", prefix: "├── github : ", label: "github.com/shyweeds", href: "https://github.com/shyweeds" },
        { kind: "link", prefix: "└── gitee  : ", label: "gitee.com/happy_shyweeds", href: "https://gitee.com/happy_shyweeds" },
        { kind: "blank" },
        { kind: "footer", text: "[ system ]" },
        { kind: "footer", text: "└── last login : now on tty0" }
      ];

      function setAsciiMeter(progress) {
        const width = 28;
        const smooth = 1 - Math.pow(1 - progress, 2.2);
        const active = Math.floor(smooth * width);
        const flow = Math.floor(Date.now() / 120) % width;
        let out = "[";
        for (let i = 0; i < width; i++) {
          if (i < active) out += (i === flow ? ">" : "=");
          else out += ".";
        }
        out += "]";
        meterAscii.textContent = out;
      }

      function createSpectrumFrame(tick = 0) {
        const bars = 24;
        const rows = 8;
        const data = [];

        for (let x = 0; x < bars; x++) {
          const wave = Math.sin((tick * 0.09) + x * 0.55);
          const noise = Math.sin((tick * 0.03) + x * 1.7);
          const height = Math.floor(((wave + noise + 2) / 4) * rows) + 1;
          data.push(height);
        }

        const lines = [];
        for (let y = rows; y >= 1; y--) {
          let line = "";
          for (let x = 0; x < bars; x++) {
            line += data[x] >= y ? "█" : " ";
          }
          lines.push(line);
        }

        return `┌────────────────────────┐\n${lines.map(l => `│${l}│`).join("\n")}\n└────────────────────────┘`;
      }

      let spectrumTimer = null;

      function showOrnament() {
        statusLabel.textContent = "[ ready ]";
        statusRight.textContent = "ok";
        activity.style.display = "none";

        meter.style.opacity = "0";
        meter.style.transform = "translateY(-8px)";
        meter.style.maxHeight = "0";
        meter.style.margin = "0";

        ornament.hidden = false;
        requestAnimationFrame(() => {
          ornament.classList.add("visible");
        });

        let tick = 0;
        spectrum.textContent = createSpectrumFrame(tick);
        spectrumTimer = window.setInterval(() => {
          spectrum.textContent = createSpectrumFrame(tick++);
        }, 90);
      }

      async function typeInto(el, text, minDelay = 26, maxDelay = 52) {
        el.textContent = "";
        for (let i = 0; i < text.length; i++) {
          el.textContent += text[i];
          await wait(rand(minDelay, maxDelay));
        }
      }

      function makeLine(className) {
        const line = document.createElement("div");
        line.className = `output-line ${className || ""}`.trim();
        output.appendChild(line);
        return line;
      }

      async function typeTextLine(text, className = "tree", options = {}) {
        const line = makeLine(className);
        const span = document.createElement("span");
        line.appendChild(span);

        const minDelay = options.minDelay ?? 6;
        const maxDelay = options.maxDelay ?? 16;
        const afterPause = options.afterPause ?? 0;

        for (let i = 0; i < text.length; i++) {
          span.textContent += text[i];
          await wait(rand(minDelay, maxDelay));
        }

        if (afterPause) await wait(afterPause);
      }

      async function typeLinkLine(prefix, label, href, options = {}) {
        const line = makeLine("output-line link");
        const spanPrefix = document.createElement("span");
        const anchor = document.createElement("a");
        line.appendChild(spanPrefix);
        line.appendChild(anchor);

        anchor.href = href;
        anchor.target = "_blank";
        anchor.rel = "noreferrer noopener";

        const minDelay = options.minDelay ?? 6;
        const maxDelay = options.maxDelay ?? 16;
        const afterPause = options.afterPause ?? 0;

        for (let i = 0; i < prefix.length; i++) {
          spanPrefix.textContent += prefix[i];
          await wait(rand(minDelay, maxDelay));
        }

        for (let i = 0; i < label.length; i++) {
          anchor.textContent += label[i];
          await wait(rand(minDelay, maxDelay));
        }

        if (afterPause) await wait(afterPause);
      }

      async function renderOutput() {
        status.hidden = false;
        let done = 0;
        const total = steps.length;

        const bump = async (pause = 0) => {
          done += 1;
          setAsciiMeter(done / total);
          if (pause) await wait(pause);
        };

        for (const step of steps) {
          if (step.kind === "blank") {
            makeLine("blank");
            await bump(30);
            continue;
          }

          if (step.kind === "text") {
            await typeTextLine(step.text, step.cls, {
              minDelay: 5,
              maxDelay: 13,
              afterPause: step.cls === "title" ? 70 : 45
            });
            await bump(step.cls === "title" ? 28 : 40);
            continue;
          }

          if (step.kind === "link") {
            await typeLinkLine(step.prefix, step.label, step.href, { afterPause: 45 });
            await bump(40);
            continue;
          }

          if (step.kind === "footer") {
            await typeTextLine(step.text, "footer", {
              minDelay: 5,
              maxDelay: 12,
              afterPause: 35
            });
            await bump(32);
          }
        }

        setAsciiMeter(1);
        await wait(180);
        showOrnament();
      }

      function attachOrnamentInteraction() {
        const settle = () => {
          spectrumWrap.style.transform = "rotate(0deg) translateY(0px)";
        };

        spectrumWrap.addEventListener("pointermove", (e) => {
          const rect = spectrumWrap.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width - 0.5;
          const y = (e.clientY - rect.top) / rect.height - 0.5;
          const rotate = x * 6;
          const lift = -Math.max(0, 2 - Math.abs(y * 6));
          spectrumWrap.style.transform = `rotate(${rotate.toFixed(2)}deg) translateY(${lift.toFixed(2)}px)`;
        });

        spectrumWrap.addEventListener("pointerleave", settle);
        spectrumWrap.addEventListener("click", () => {
          spectrumWrap.classList.remove("pulse");
          void spectrumWrap.offsetWidth;
          spectrumWrap.classList.add("pulse");
        });
        spectrumWrap.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            spectrumWrap.classList.remove("pulse");
            void spectrumWrap.offsetWidth;
            spectrumWrap.classList.add("pulse");
          }
        });
      }

      async function run() {
        attachOrnamentInteraction();
        await wait(300);
        await typeInto(cmdTarget, command, 24, 45);
        await wait(120);
        await renderOutput();
      }

      run();
    })();
  </script>
</body>
</html>
